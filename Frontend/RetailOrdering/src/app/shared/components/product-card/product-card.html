<ng-container *ngIf="product; else noProduct">
  <div class="card h-100">
    <div class="card-body d-flex flex-column">
      <div class="mb-3">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="text-muted mb-2">{{ product.category }}</p>
        <p class="fs-5 fw-semibold mb-0">₹{{ product.price | number:'1.2-2' }}</p>
      </div>
      <div class="mt-auto d-flex justify-content-between align-items-center">
        <button type="button" class="btn btn-sm btn-primary" (click)="onAddToCart()">
          Add to cart
        </button>
        <span class="badge bg-secondary">Stock: {{ product.stockQty }}</span>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #noProduct>
  <div class="alert alert-secondary">Product information is not available.</div>
</ng-template>
