<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top py-3">
  <div class="container">
    <!-- Brand Identity -->
    <a class="navbar-brand d-flex align-items-center fw-black tracking-tight text-primary" routerLink="/">
      <i class="bi bi-basket2-fill fs-3 me-2"></i>
      <span class="fs-4">QuickEats</span>
    </a>

    <!-- Mobile Menu Toggle -->
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Main Navigation Links -->
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 ms-lg-4">
        <li class="nav-item">
          <a class="nav-link px-3 rounded-pill fw-medium transition-all" routerLink="/products" routerLinkActive="active-nav-link">Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 rounded-pill fw-medium transition-all" routerLink="/orders" routerLinkActive="active-nav-link">Orders</a>
        </li>
      </ul>

      <!-- User Actions -->
      <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0">
        
        <!-- Shopping Cart Button -->
        <a class="btn btn-light rounded-pill px-4 py-2 position-relative d-flex align-items-center border hover-grow shadow-sm" routerLink="/cart">
          <i class="bi bi-cart3 fs-5 me-2"></i>
          <span class="fw-bold text-dark">Cart</span>
          <!-- Dynamic Badge -->
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white border-2 px-2 py-1" 
                *ngIf="(cartCount$ | async) as count">
            {{ count }}
          </span>
        </a>

        <!-- Visual Divider (Desktop Only) -->
        <div class="vr d-none d-lg-block text-secondary mx-1 opacity-25"></div>

        <!-- Authenticated User Dropdown -->
        <ng-container *ngIf="isAuthenticated; else authActions">
          <div class="dropdown">
            <button class="btn btn-outline-secondary rounded-pill dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 border hover-shadow bg-white" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center" style="width: 28px; height: 28px;">
                <i class="bi bi-person-fill small"></i>
              </div>
              <span class="fw-bold text-dark text-truncate" style="max-width: 120px;" *ngIf="(user$ | async) as user">{{ user.name || user.email }}</span>
            </button>
            
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 mt-3 p-2 border border-light">
              <li><h6 class="dropdown-header text-uppercase tracking-wide small">My Account</h6></li>
              <li>
                <a class="dropdown-item py-2 rounded-3 d-flex align-items-center" routerLink="/profile">
                  <i class="bi bi-person-gear me-3 text-muted fs-5"></i> Profile Settings
                </a>
              </li>
              <li>
                <a class="dropdown-item py-2 rounded-3 d-flex align-items-center" routerLink="/orders">
                  <i class="bi bi-receipt me-3 text-muted fs-5"></i> Order History
                </a>
              </li>
              
              <!-- Conditional Admin Portal Link -->
              <ng-container *ngIf="isAuthenticated && canAccessAdmin">
                <li><hr class="dropdown-divider my-2" /></li>
                <li>
                  <a class="dropdown-item py-2 rounded-3 text-primary fw-medium d-flex align-items-center" routerLink="/admin">
                    <i class="bi bi-shield-lock me-3 fs-5"></i> Admin Portal
                  </a>
                </li>
              </ng-container>
              
              <li><hr class="dropdown-divider my-2" /></li>
              <li>
                <button class="dropdown-item py-2 rounded-3 text-danger d-flex align-items-center fw-medium" type="button" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-3 fs-5"></i> Logout
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

        <!-- Unauthenticated Login/Signup Buttons -->
        <ng-template #authActions>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-dark rounded-pill px-4 py-2 fw-medium hover-shadow bg-white" routerLink="/login">Log In</a>
            <a class="btn btn-primary rounded-pill px-4 py-2 fw-medium shadow-sm hover-grow" routerLink="/register">Sign Up</a>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
