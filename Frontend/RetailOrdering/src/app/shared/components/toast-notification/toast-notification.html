<div class="toast-stack position-fixed top-0 end-0 p-3 zindex-tooltip">
  <div *ngFor="let item of toast.messages(); index as i" class="toast show align-items-center text-bg-{{ item.type }} border-0 mb-2" role="alert">
    <div class="d-flex align-items-center">
      <div class="toast-body">{{ item.text }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" (click)="toast.dismiss(i)"></button>
    </div>
  </div>
</div>
