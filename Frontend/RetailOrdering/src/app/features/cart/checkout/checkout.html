<section class="container py-5">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h2 class="mb-4">Checkout</h2>
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" class="form-control" formControlName="fullName" />
              <div *ngIf="f['fullName'].touched && f['fullName'].invalid" class="text-danger small mt-1">Full name is
                required.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" />
              <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger small mt-1">
                <div *ngIf="f['email'].errors?.['required']">Email is required.</div>
                <div *ngIf="f['email'].errors?.['email']">Enter a valid email.</div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" formControlName="phone" />
              <div *ngIf="f['phone'].touched && f['phone'].invalid" class="text-danger small mt-1">Enter a valid phone
                number.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" rows="3" formControlName="address"></textarea>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" class="form-control" formControlName="city" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Postal code</label>
                <input type="text" class="form-control" formControlName="postalCode" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Payment</label>
                <select class="form-select" formControlName="paymentMethod">
                  <option *ngFor="let method of paymentMethods" [value]="method">{{ method }}</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fs-5" [disabled]="isProcessing">
              <span class="spinner-border spinner-border-sm me-2" *ngIf="isProcessing"></span>
              {{ isProcessing ? 'Processing Payment securely...' : 'Place order' }}
            </button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 p-4">
        <h4 class="mb-3">Order summary</h4>
        <div class="mb-3 d-flex justify-content-between">
          <span>Subtotal</span>
          <strong *ngIf="(subtotal$ | async) as subtotal">₹{{ subtotal | number:'1.2-2' }}</strong>
        </div>
        <div class="mb-3 d-flex justify-content-between">
          <span>Items</span>
          <strong *ngIf="(items$ | async) as items">{{ items.length }}</strong>
        </div>
        <div class="alert alert-light">Complete your checkout with secure payment and delivery tracking.</div>
        <a routerLink="/cart" class="btn btn-outline-secondary w-100">Back to cart</a>
      </div>
    </div>
  </div>
</section>
