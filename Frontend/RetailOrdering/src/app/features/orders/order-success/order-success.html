<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body text-center py-5">
          <div class="mb-4 text-success">
            <img src="/assets/logo.svg" alt="logo" width="120" class="mb-3" />
            <div><i class="bi bi-check-circle-fill display-4 text-success"></i></div>
          </div>
          <h2 class="fw-semibold mb-3">Order Confirmed</h2>
          <p class="text-muted mb-4">
            Your reorder has been placed successfully.
            <span *ngIf="orderId">Order reference: #{{ orderId }}</span>
          </p>
          <button class="btn btn-primary" (click)="backToHistory()">Back to Orders</button>
        </div>
      </div>
    </div>
  </div>
</section>
