<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card shadow-sm p-4">
        <h1 class="h3 mb-4">Sign in</h1>

        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" formControlName="email" class="form-control" />
            <div *ngIf="email?.touched && email?.invalid" class="text-danger small mt-1">
              <div *ngIf="email?.errors?.['required']">Email is required.</div>
              <div *ngIf="email?.errors?.['email']">Enter a valid email.</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" formControlName="password" class="form-control" />
            <div *ngIf="password?.touched && password?.invalid" class="text-danger small mt-1">
              <div *ngIf="password?.errors?.['required']">Password is required.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>

        <p class="text-center text-muted mt-4">
          Don't have an account?
          <a routerLink="/register">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>
