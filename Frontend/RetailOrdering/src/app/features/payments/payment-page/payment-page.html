<div class="container py-4">
  <h1 class="mb-4">Payment</h1>

  <ng-container *ngIf="items.length > 0; else emptyCart">
    <div class="row">
      <div class="col-lg-6 mb-4">
        <div class="card p-4">
          <h2 class="h5 mb-3">Card details</h2>
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Card number</label>
              <input type="text" formControlName="cardNumber" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Name on card</label>
              <input type="text" formControlName="cardName" class="form-control" />
            </div>
            <div class="row gy-3">
              <div class="col-6">
                <label class="form-label">Expiry</label>
                <input type="text" formControlName="expiry" class="form-control" placeholder="MM/YY" />
              </div>
              <div class="col-6">
                <label class="form-label">CVV</label>
                <input type="password" formControlName="cvv" class="form-control" />
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4" [disabled]="form.invalid || isProcessing">
              {{ isProcessing ? 'Processing…' : 'Pay now' }}
            </button>
          </form>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card p-4">
          <h2 class="h5 mb-3">Order review</h2>
          <p class="mb-2">Items to purchase: <strong>{{ totalItems }}</strong></p>
          <ul class="list-group mb-3">
            <li class="list-group-item" *ngFor="let item of items">
              Product ID {{ item.productId }} <span class="badge bg-secondary ms-2">Qty: {{ item.quantity }}</span>
            </li>
          </ul>
          <button type="button" class="btn btn-outline-secondary" routerLink="/cart">
            Back to cart
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #emptyCart>
    <div class="alert alert-warning">Your cart is empty. Add items before paying.</div>
    <a routerLink="/orders" class="btn btn-primary">Browse orders</a>
  </ng-template>
</div>
